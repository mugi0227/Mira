name: Mira
options:
  bundleIdPrefix: jp.mugi
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Mira:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Mira
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.mugi.mira
        PRODUCT_NAME: Mira
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 余白
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 予定と余白が重ならないようにカレンダーを確認します。
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: 確定した予定をカレンダーへ保存します。
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - MiraTests
        - MiraUITests
  MiraTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MiraTests
    dependencies:
      - target: Mira
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.mugi.mira.tests
        GENERATE_INFOPLIST_FILE: YES
  MiraUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MiraUITests
    dependencies:
      - target: Mira
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.mugi.mira.uitests
        GENERATE_INFOPLIST_FILE: YES
