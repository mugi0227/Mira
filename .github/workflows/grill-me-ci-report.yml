name: Grill-Me CI Report

on:
  workflow_run:
    workflows:
      - Grill-Me Complete Validation
      - Simulator Screenshots
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  report:
    if: github.event.workflow_run.head_branch == 'feature/grill-me-q61-q82'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0

      - name: Build concise report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set +e
          mkdir -p ci
          SAFE_NAME=$(echo "$WORKFLOW_NAME" | tr '[:upper:] /' '[:lower:]--' | tr -cd 'a-z0-9-')
          REPORT="ci/${SAFE_NAME}-latest.txt"
          {
            echo "workflow: $WORKFLOW_NAME"
            echo "conclusion: $CONCLUSION"
            echo "head_sha: $HEAD_SHA"
            echo "run_url: $RUN_URL"
            echo "generated_at: $(date -u +%FT%TZ)"
            echo
            if [[ "$CONCLUSION" == "success" ]]; then
              echo "VALIDATION_PASS"
            else
              echo "VALIDATION_FAILED"
              echo
              echo "---- failed log excerpts ----"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 \
                | grep -E "(^|[^A-Za-z])(error:|fatal error:|failed|FAIL|XCTAssert|No available|not found|unavailable)" \
                | tail -n 300 || true
              echo
              echo "---- job summary ----"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" 2>&1 || true
            fi
          } > "$REPORT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT"
          git diff --cached --quiet && exit 0
          git commit -m "ci: update Grill-Me validation report [skip ci]"
          git push origin HEAD:feature/grill-me-q61-q82
