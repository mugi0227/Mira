name: Apply Grill-Me Margin Planning Mode

on:
  push:
    branches:
      - feature/grill-me-q61-q82
    paths:
      - scripts/grill_me_margin_mode_persistence.py
      - .github/workflows/grill-me-margin-mode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[margin-mode]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/grill_me_margin_mode_persistence.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mira scripts
          git commit -m "feat: persist margin planning mode [margin-mode]"
          git pull --rebase origin feature/grill-me-q61-q82
          git push origin HEAD:feature/grill-me-q61-q82
