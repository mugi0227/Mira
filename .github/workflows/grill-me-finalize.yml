name: Grill-Me Finalize

on:
  workflow_run:
    workflows:
      - Grill-Me Complete Validation
      - Simulator Screenshots
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.event.workflow_run.head_branch == 'feature/grill-me-q61-q82'
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required workflow passed for the same HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          latest_run() {
            local workflow="$1"
            gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/workflows/$workflow/runs" \
              -f branch='feature/grill-me-q61-q82' \
              -f per_page=20 \
              --jq ".workflow_runs[] | select(.head_sha == \"$EXPECTED_SHA\") | [.id,.status,.conclusion] | @tsv" \
              | head -n 1
          }

          VALIDATION=$(latest_run 'grill-me-complete.yml')
          SCREENSHOTS=$(latest_run 'screenshots.yml')

          echo "validation=$VALIDATION"
          echo "screenshots=$SCREENSHOTS"

          [[ -n "$VALIDATION" && -n "$SCREENSHOTS" ]]
          [[ "$(echo "$VALIDATION" | cut -f2)" == 'completed' ]]
          [[ "$(echo "$VALIDATION" | cut -f3)" == 'success' ]]
          [[ "$(echo "$SCREENSHOTS" | cut -f2)" == 'completed' ]]
          [[ "$(echo "$SCREENSHOTS" | cut -f3)" == 'success' ]]

      - name: Mark PR ready and squash merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr ready 8 --repo "$GITHUB_REPOSITORY" || true
          gh pr merge 8 --repo "$GITHUB_REPOSITORY" --squash --admin --delete-branch=false
