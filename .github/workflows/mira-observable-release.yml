name: Mira Observable Final Release

on:
  push:
    branches:
      - feature/grill-me-q61-q82
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mira-observable-final-release
  cancel-in-progress: true

jobs:
  verify-release:
    if: ${{ !contains(github.event.head_commit.message || '', '[observable-green]') }}
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Signal start
        run: curl -fsS -d "STARTED:${GITHUB_SHA}" https://ntfy.sh/mira-ci-8f2e4c6d1a9b4370b8f1e6c4d2a7f9e3 >/dev/null || true

      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0

      - name: Settle and rebase
        run: |
          sleep 45
          git fetch origin main feature/grill-me-q61-q82
          git rebase origin/main
          echo "START_REMOTE_SHA=$(git rev-parse origin/feature/grill-me-q61-q82)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply finalizer when still present
        run: |
          if [ -f scripts/grill_me_release_v3.py ]; then
            python scripts/grill_me_release_v3.py
          fi

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee observable-build.log

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:MiraTests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee observable-unit.log

      - name: UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:MiraUITests/GrillMeFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee observable-ui.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observable-mira-release-logs
          path: |
            observable-build.log
            observable-unit.log
            observable-ui.log
          if-no-files-found: ignore

      - name: Verify current branch head
        run: |
          git fetch origin feature/grill-me-q61-q82
          REMOTE_SHA=$(git rev-parse origin/feature/grill-me-q61-q82)
          if [ "$REMOTE_SHA" != "$START_REMOTE_SHA" ]; then
            curl -fsS -d "RETRY:${REMOTE_SHA}" https://ntfy.sh/mira-ci-8f2e4c6d1a9b4370b8f1e6c4d2a7f9e3 >/dev/null || true
            exit 1
          fi

      - name: Create validated product commit
        run: |
          find .github/workflows -maxdepth 1 -type f -iname '*grill-me*.yml' -delete
          rm -f .github/workflows/mira-observable-release.yml
          rm -f scripts/finalize_grill_me.py scripts/grill_me_*.py
          cat > docs/grill-me-validation.md <<EOF
          # Grill-Me Q61〜Q82 最終検証

          - Result: GREEN
          - Runner: macOS 26
          - Xcode: 26.6
          - Mira application build: success
          - All MiraTests: success
          - GrillMeFlowUITests: success

          検証後の変更は、この記録と一時CIファイルの削除だけです。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish Mira conversational scheduling [observable-green]"
          git push --force-with-lease origin HEAD:feature/grill-me-q61-q82
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or find PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list --repo "${{ github.repository }}" --head feature/grill-me-q61-q82 --state open --json number --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head feature/grill-me-q61-q82 \
              --title "Complete Mira Grill-Me Q61–Q82" \
              --body-file docs/implementation-grill-me-q61-q82.md)
            NUMBER=${URL##*/}
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Merge validated PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" || true
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --squash --admin --delete-branch=false
          curl -fsS -d "MERGED:${PRODUCT_SHA}" https://ntfy.sh/mira-ci-8f2e4c6d1a9b4370b8f1e6c4d2a7f9e3 >/dev/null || true

      - name: Signal failure
        if: failure()
        run: curl -fsS -d "RED:${GITHUB_SHA}" https://ntfy.sh/mira-ci-8f2e4c6d1a9b4370b8f1e6c4d2a7f9e3 >/dev/null || true
