name: iOS CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mira-ios-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  xcode26-build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build with the iOS 26 SDK
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcode26-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode26-build-log
          path: xcode26-build.log
          if-no-files-found: ignore

  simulator-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select available Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          else
            XCODE_PATH=$(ls -d /Applications/Xcode*.app/Contents/Developer | sort -V | tail -1)
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Resolve an available iPhone Simulator
        run: |
          SIMULATOR_UDID=$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "-j"
          ]))
          for devices in data.get("devices", {}).values():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone Simulator found")
          PY
          )
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Using simulator $SIMULATOR_UDID"
      - name: Build and run unit/UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            -skip-testing:MiraUITests/MiraScreenshotUITests \
            test | tee simulator-tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-log
          path: simulator-tests.log
          if-no-files-found: ignore
