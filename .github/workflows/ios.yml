name: iOS CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-ios-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app/Contents/Developer | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve an available iPhone Simulator
        run: |
          SIMULATOR_UDID=$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "-j"
          ]))
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iPhone Simulator found")
          runtime, name, udid = sorted(candidates)[-1]
          print(udid)
          PY
          )
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Using simulator $SIMULATOR_UDID"

      - name: Build application
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:MiraTests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee unit-tests.log

      - name: Run Grill-Me UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -only-testing:MiraUITests/GrillMeFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee ui-tests.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-validation-logs
          path: |
            build.log
            unit-tests.log
            ui-tests.log
          if-no-files-found: ignore
