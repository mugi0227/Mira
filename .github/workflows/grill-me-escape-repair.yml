name: Apply Grill-Me Escape Repair

on:
  push:
    branches:
      - feature/grill-me-q61-q82
    paths:
      - scripts/grill_me_escape_repair.py
      - .github/workflows/grill-me-escape-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[escape-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if [ -f scripts/grill_me_date_parsing.py ]; then python scripts/grill_me_date_parsing.py; fi
          python scripts/grill_me_escape_repair.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mira scripts
          git commit -m "fix: repair Swift regex escaping [escape-repair]"
          git pull --rebase origin feature/grill-me-q61-q82
          git push origin HEAD:feature/grill-me-q61-q82
