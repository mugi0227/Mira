name: Swift Syntax Check

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mira-syntax-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  parse-all-swift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Parse every Swift source file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find Mira MiraTests MiraUITests -name '*.swift' -type f | sort)
          printf 'Parsing %s Swift files\n' "${#files[@]}"
          for file in "${files[@]}"; do
            echo "::group::$file"
            swiftc -frontend -parse "$file"
            echo "::endgroup::"
          done
