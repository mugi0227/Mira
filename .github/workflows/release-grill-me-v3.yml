name: Release Grill-Me V3

on:
  push:
    branches:
      - feature/grill-me-q61-q82
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-grill-me-v3
  cancel-in-progress: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[grill-me-v3-green]') }}
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0

      - name: Let earlier patch jobs settle
        run: sleep 75

      - name: Rebase onto latest main and record remote head
        run: |
          git fetch origin main feature/grill-me-q61-q82
          git rebase origin/main
          echo "START_REMOTE_SHA=$(git rev-parse origin/feature/grill-me-q61-q82)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Produce definitive product tree
        run: python scripts/grill_me_release_v3.py

      - name: Remove temporary implementation machinery
        run: |
          find .github/workflows -maxdepth 1 -type f -iname '*grill-me*.yml' ! -name 'release-grill-me-v3.yml' -delete
          rm -f scripts/finalize_grill_me.py
          rm -f scripts/grill_me_*.py

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Mira
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee grill-me-v3-build.log

      - name: Run all unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:MiraTests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee grill-me-v3-unit.log

      - name: Run conversational UI flows
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:MiraUITests/GrillMeFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee grill-me-v3-ui.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grill-me-v3-validation
          path: |
            grill-me-v3-build.log
            grill-me-v3-unit.log
            grill-me-v3-ui.log
          if-no-files-found: ignore

      - name: Verify no newer branch commit appeared
        run: |
          git fetch origin feature/grill-me-q61-q82
          REMOTE_SHA=$(git rev-parse origin/feature/grill-me-q61-q82)
          if [ "$REMOTE_SHA" != "$START_REMOTE_SHA" ]; then
            echo "A newer branch commit exists. Its own V3 run must validate it."
            exit 1
          fi

      - name: Commit only the validated product tree
        run: |
          cat > docs/grill-me-validation.md <<EOF
          # Grill-Me Q61〜Q82 最終検証

          - Result: GREEN
          - Product source validated from branch ref: ${{ github.sha }}
          - Runner: macOS 26
          - Xcode: 26.6
          - Application build: success
          - Unit tests: all MiraTests success
          - UI tests: GrillMeFlowUITests success

          検証後に加えた変更は、この記録と一時ワークフローの削除だけです。
          EOF
          rm -f .github/workflows/release-grill-me-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Grill-Me Q61-Q82 [grill-me-v3-green]"
          git push --force-with-lease origin HEAD:feature/grill-me-q61-q82

      - name: Ensure an open PR exists
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head feature/grill-me-q61-q82 \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head feature/grill-me-q61-q82 \
              --title "Complete Grill-Me Q61–Q82 implementation" \
              --body-file docs/implementation-grill-me-q61-q82.md)
            NUMBER=${URL##*/}
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Ready and squash merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" || true
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --admin \
            --delete-branch=false
