name: Merge Grill-Me On Green

on:
  workflow_run:
    workflows:
      - Validate Grill-Me Q61-Q82
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'feature/grill-me-q61-q82'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Find implementation PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head feature/grill-me-q61-q82 \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            echo "No open PR found."
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Mark ready and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" || true
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --admin \
            --delete-branch=false
