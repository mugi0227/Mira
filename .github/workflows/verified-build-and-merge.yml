name: Verified Mira Build and Merge

on:
  push:
    branches:
      - feature/grill-me-verified
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verified-mira-build
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      ${{
        !contains(github.event.head_commit.message || '', '[verified-green]') &&
        !contains(github.event.head_commit.message || '', '[verified-log]')
      }}
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-verified
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Materialize final implementation patches
        run: python3 scripts/verified_build_prep.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for runtime, devices in data.get("devices", {}).items():
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone 16"):
                      print(d["udid"]); raise SystemExit
          for runtime, devices in data.get("devices", {}).items():
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      print(d["udid"]); raise SystemExit
          raise SystemExit("No available iPhone simulator")')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build application
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build | tee verified-build.log

      - name: Run unit tests
        id: unit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived-data \
            -only-testing:MiraTests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee verified-unit.log

      - name: Run Grill-Me UI tests
        id: ui
        if: steps.build.outcome == 'success' && steps.unit.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .derived-data \
            -only-testing:MiraUITests/GrillMeFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee verified-ui.log

      - name: Record failure diagnostics
        if: steps.build.outcome != 'success' || steps.unit.outcome != 'success' || steps.ui.outcome != 'success'
        run: |
          mkdir -p ci/verified-build
          {
            echo '# Verified Mira build failure'
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Build: ${{ steps.build.outcome }}"
            echo "- Unit tests: ${{ steps.unit.outcome }}"
            echo "- UI tests: ${{ steps.ui.outcome }}"
            echo
            echo '## Compiler/test errors'
            grep -hE '(^| )error:|failed|Failure|XCTAssert' verified-build.log verified-unit.log verified-ui.log 2>/dev/null | tail -n 250 || true
          } > ci/verified-build/latest.md
          cp verified-build.log ci/verified-build/ 2>/dev/null || true
          cp verified-unit.log ci/verified-build/ 2>/dev/null || true
          cp verified-ui.log ci/verified-build/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/verified-build Mira scripts README.md docs || true
          git commit -m "ci: record verified Mira diagnostics [verified-log]" || true
          git push origin HEAD:feature/grill-me-verified || true
          exit 1

      - name: Commit exactly tested product
        if: steps.build.outcome == 'success' && steps.unit.outcome == 'success' && steps.ui.outcome == 'success'
        run: |
          rm -rf ci/verified-build
          find .github/workflows -maxdepth 1 -type f ! -name 'ios.yml' ! -name 'screenshots.yml' -delete
          rm -f scripts/finalize_grill_me.py scripts/grill_me_*.py scripts/mira_release_v*.py scripts/verified_build_prep.py
          cat > docs/grill-me-validation.md <<EOF
          # Grill-Me Q61〜Q82 最終検証

          - Result: GREEN
          - Runner: GitHub-hosted macOS 15
          - Xcode: $(xcodebuild -version | tr '\n' ' ')
          - Application build: success
          - MiraTests: success
          - GrillMeFlowUITests: success
          - Validated commit before cleanup: ${GITHUB_SHA}

          検証後の差分は、一時CIファイル・修正スクリプトの削除とこの記録だけです。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete verified Mira Grill-Me Q61-Q82 [verified-green]"
          git push origin HEAD:feature/grill-me-verified

      - name: Create PR and merge
        if: steps.build.outcome == 'success' && steps.unit.outcome == 'success' && steps.ui.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list --repo "${{ github.repository }}" --head feature/grill-me-verified --state open --json number --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head feature/grill-me-verified \
              --title "Complete verified Mira Grill-Me Q61-Q82" \
              --body-file docs/implementation-grill-me-q61-q82.md)
            NUMBER=${URL##*/}
          fi
          gh pr ready "$NUMBER" --repo "${{ github.repository }}" || true
          gh pr merge "$NUMBER" --repo "${{ github.repository }}" --squash --admin --delete-branch=false
