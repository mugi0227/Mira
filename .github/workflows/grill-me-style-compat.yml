name: Apply Grill-Me Style Compatibility

on:
  push:
    branches:
      - feature/grill-me-q61-q82
    paths:
      - scripts/grill_me_style_compat.py
      - Mira/Features/Conversation/**
      - Mira/Features/Adjustments/SchedulingModeView.swift
      - .github/workflows/grill-me-style-compat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[style-compatible]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python scripts/grill_me_hardening.py
          python scripts/grill_me_logic_fixes.py
          python scripts/grill_me_style_compat.py
      - name: Commit compatibility fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mira README.md docs scripts
          git commit -m "fix: align Grill-Me UI with design tokens [style-compatible]"
          git push origin HEAD:feature/grill-me-q61-q82
