name: Apply Grill-Me Case Continuation

on:
  push:
    branches:
      - feature/grill-me-q61-q82
    paths:
      - Mira/App/MiraStore+ConversationContext.swift
      - scripts/grill_me_case_continuation.py
      - .github/workflows/grill-me-case-continuation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[case-continuation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply case continuation
        run: python scripts/grill_me_case_continuation.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mira scripts
          git commit -m "feat: wire structured case continuation [case-continuation]"
          git pull --rebase origin feature/grill-me-q61-q82
          git push origin HEAD:feature/grill-me-q61-q82
