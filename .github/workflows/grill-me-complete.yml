name: Grill-Me Complete Validation

on:
  push:
    branches:
      - feature/grill-me-q61-q82
  pull_request:
    branches:
      - main
    paths:
      - "Mira/**"
      - "MiraOverrides/**"
      - "MiraTests/**"
      - "MiraUITests/**"
      - "project.yml"
      - ".github/workflows/grill-me-complete.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grill-me-complete-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Xcode 16.4 build and tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Choose simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | sed -n 's/^[[:space:]]*\(iPhone[^()]\+\) (.*$/\1/p' | head -n 1 | xargs)
          if [[ -z "$DEVICE" ]]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          echo "name=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using $DEVICE"

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-xcode16.log

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MiraTests \
            test | tee tests-xcode16.log

      - name: Run UI smoke tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:MiraUITests \
            test | tee ui-tests-xcode16.log

      - name: Upload Xcode 16 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grill-me-xcode16-logs
          path: |
            build-xcode16.log
            tests-xcode16.log
            ui-tests-xcode16.log
          if-no-files-found: ignore

  foundation-models:
    name: Xcode 26 Foundation Models build
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for generic simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData26 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-xcode26.log

      - name: Upload Xcode 26 log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grill-me-xcode26-log
          path: build-xcode26.log
          if-no-files-found: ignore
