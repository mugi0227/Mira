name: Apply Grill-Me Finalization

on:
  push:
    branches:
      - feature/grill-me-q61-q82
    paths:
      - scripts/finalize_grill_me.py
      - Mira/**
      - README.md
      - docs/**
      - .github/workflows/apply-grill-me-finalization.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grill-me-finalization
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply idempotent patches
        run: python scripts/finalize_grill_me.py

      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No finalization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mira README.md docs scripts
          git commit -m "chore: finalize Grill-Me integration [finalized]"
          git push origin HEAD:feature/grill-me-q61-q82
