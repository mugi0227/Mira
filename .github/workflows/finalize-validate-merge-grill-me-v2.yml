name: Finalize Validate Merge Grill-Me V2

on:
  push:
    branches:
      - feature/grill-me-q61-q82
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: final-grill-me-v2
  cancel-in-progress: true

jobs:
  finalize-validate-merge:
    if: ${{ !contains(github.event.head_commit.message || '', '[grill-me-v2-green]') }}
    runs-on: macos-26
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0

      - name: Rebase onto latest main
        run: |
          git fetch origin main feature/grill-me-q61-q82
          git rebase origin/main
          echo "START_REMOTE_SHA=$(git rev-parse origin/feature/grill-me-q61-q82)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply authoritative product finalization
        run: python scripts/grill_me_final_v2.py

      - name: Remove temporary patch and validation machinery
        run: |
          find .github/workflows -maxdepth 1 -type f \( \
            -name 'apply-grill-me-finalization.yml' -o \
            -name 'grill-me-compile-fixes.yml' -o \
            -name 'grill-me-hardening.yml' -o \
            -name 'grill-me-logic-fixes.yml' -o \
            -name 'grill-me-style-compat.yml' -o \
            -name 'grill-me-authoritative-finalize.yml' -o \
            -name 'grill-me-cleanup.yml' -o \
            -name 'merge-grill-me-on-green.yml' -o \
            -name 'final-validate-and-merge-grill-me.yml' -o \
            -name 'grill-me-case-continuation.yml' -o \
            -name 'grill-me-held-candidates.yml' -o \
            -name 'validate-grill-me.yml' -o \
            -name 'finalize-validate-merge-grill-me-v2.yml' \
          \) -delete
          rm -f \
            scripts/finalize_grill_me.py \
            scripts/grill_me_compile_fixes.py \
            scripts/grill_me_hardening.py \
            scripts/grill_me_logic_fixes.py \
            scripts/grill_me_style_compat.py \
            scripts/grill_me_case_continuation.py \
            scripts/grill_me_held_candidates.py \
            scripts/grill_me_final_v2.py

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build application
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee final-v2-build.log

      - name: Run all unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:MiraTests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee final-v2-unit-tests.log

      - name: Run Grill-Me UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:MiraUITests/GrillMeFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee final-v2-ui-tests.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-grill-me-v2-validation
          path: |
            final-v2-build.log
            final-v2-unit-tests.log
            final-v2-ui-tests.log
          if-no-files-found: ignore

      - name: Ensure branch did not move during validation
        run: |
          git fetch origin feature/grill-me-q61-q82
          CURRENT_REMOTE_SHA=$(git rev-parse origin/feature/grill-me-q61-q82)
          if [ "$CURRENT_REMOTE_SHA" != "$START_REMOTE_SHA" ]; then
            echo "Remote branch moved during validation; a newer run will validate it."
            exit 1
          fi

      - name: Record validated product tree
        run: |
          cat > docs/grill-me-validation.md <<EOF
          # Grill-Me Q61〜Q82 最終検証

          - Result: GREEN
          - Validated source ref: ${{ github.sha }}
          - Runner: macOS 26
          - Xcode: 26.6
          - App build: success
          - Unit tests: all MiraTests success
          - UI tests: GrillMeFlowUITests success

          検証後に追加した変更は、この記録と一時CIファイルの削除のみです。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Grill-Me Q61-Q82 implementation [grill-me-v2-green]"
          git push --force-with-lease origin HEAD:feature/grill-me-q61-q82

      - name: Create or locate pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head feature/grill-me-q61-q82 \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            NUMBER=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head feature/grill-me-q61-q82 \
              --title "Complete Grill-Me Q61–Q82 implementation" \
              --body-file docs/implementation-grill-me-q61-q82.md)
            NUMBER=${NUMBER##*/}
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Mark ready and squash merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" || true
          gh pr merge "${{ steps.pr.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --admin \
            --delete-branch=false
