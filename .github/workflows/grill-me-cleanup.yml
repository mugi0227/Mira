name: Clean Temporary Grill-Me Machinery

on:
  push:
    branches:
      - feature/grill-me-q61-q82
    paths:
      - .github/workflows/grill-me-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final product patches once more
        run: |
          python scripts/grill_me_hardening.py
          python scripts/grill_me_logic_fixes.py
          python scripts/grill_me_style_compat.py

      - name: Remove temporary machinery
        run: |
          rm -f \
            .github/workflows/apply-grill-me-finalization.yml \
            .github/workflows/grill-me-compile-fixes.yml \
            .github/workflows/grill-me-hardening.yml \
            .github/workflows/grill-me-logic-fixes.yml \
            .github/workflows/grill-me-style-compat.yml \
            .github/workflows/grill-me-authoritative-finalize.yml \
            .github/workflows/merge-grill-me-on-green.yml \
            .github/workflows/grill-me-cleanup.yml \
            scripts/finalize_grill_me.py \
            scripts/grill_me_compile_fixes.py \
            scripts/grill_me_hardening.py \
            scripts/grill_me_logic_fixes.py \
            scripts/grill_me_style_compat.py

      - name: Commit final product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "chore: remove temporary Grill-Me patch machinery [cleanup]"
          git pull --rebase origin feature/grill-me-q61-q82
          git push origin HEAD:feature/grill-me-q61-q82
