name: Release Mira V5

on:
  push:
    branches:
      - feature/grill-me-q61-q82
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-mira-v5
  cancel-in-progress: true

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[mira-v5-green]') }}
    runs-on: macos-26
    timeout-minutes: 85

    steps:
      - name: Signal start
        run: curl -fsS -d "STARTED:${GITHUB_SHA}" https://ntfy.sh/mira-ci-v5-72b63ad014f94c75b13e85a69fd2470c >/dev/null || true

      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0

      - name: Settle concurrent patch jobs and rebase
        run: |
          sleep 120
          git fetch origin main feature/grill-me-q61-q82
          git rebase origin/main
          echo "START_REMOTE_SHA=$(git rev-parse origin/feature/grill-me-q61-q82)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply self-contained finalization
        run: python scripts/mira_release_v5.py

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build Mira
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee mira-v5-build.log

      - name: Run all unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:MiraTests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee mira-v5-unit.log

      - name: Run Grill-Me UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Mira.xcodeproj \
            -scheme Mira \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:MiraUITests/GrillMeFlowUITests \
            CODE_SIGNING_ALLOWED=NO \
            test | tee mira-v5-ui.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mira-v5-validation-logs
          path: |
            mira-v5-build.log
            mira-v5-unit.log
            mira-v5-ui.log
          if-no-files-found: ignore

      - name: Ensure tested branch is still latest
        run: |
          git fetch origin feature/grill-me-q61-q82
          REMOTE_SHA=$(git rev-parse origin/feature/grill-me-q61-q82)
          if [ "$REMOTE_SHA" != "$START_REMOTE_SHA" ]; then
            curl -fsS -d "RETRY:${REMOTE_SHA}" https://ntfy.sh/mira-ci-v5-72b63ad014f94c75b13e85a69fd2470c >/dev/null || true
            exit 1
          fi

      - name: Commit validated product tree and remove temporary machinery
        run: |
          find .github/workflows -maxdepth 1 -type f \( \
            -iname '*grill-me*.yml' -o \
            -iname '*mira-observable*.yml' -o \
            -name 'release-mira-v4-observable.yml' -o \
            -name 'release-mira-v5.yml' \
          \) -delete
          rm -f scripts/finalize_grill_me.py scripts/grill_me_*.py scripts/mira_release_v4.py scripts/mira_release_v5.py
          cat > docs/grill-me-validation.md <<EOF
          # Grill-Me Q61〜Q82 最終検証

          - Result: GREEN
          - Runner: macOS 26
          - Xcode: 26.6
          - Mira application build: success
          - All MiraTests: success
          - GrillMeFlowUITests: success

          検証後に加えた変更は、この記録と一時CIファイルの削除だけです。
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete Mira Grill-Me Q61-Q82 [mira-v5-green]"
          git push --force-with-lease origin HEAD:feature/grill-me-q61-q82
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or locate pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUMBER=$(gh pr list --repo "${{ github.repository }}" --head feature/grill-me-q61-q82 --state open --json number --jq '.[0].number')
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            URL=$(gh pr create \
              --repo "${{ github.repository }}" \
              --base main \
              --head feature/grill-me-q61-q82 \
              --title "Complete Mira Grill-Me Q61–Q82" \
              --body-file docs/implementation-grill-me-q61-q82.md)
            NUMBER=${URL##*/}
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Mark ready and squash merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" || true
          gh pr merge "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --squash --admin --delete-branch=false
          curl -fsS -d "MERGED:${PRODUCT_SHA}" https://ntfy.sh/mira-ci-v5-72b63ad014f94c75b13e85a69fd2470c >/dev/null || true

      - name: Signal failure
        if: failure()
        run: curl -fsS -d "RED:${GITHUB_SHA}" https://ntfy.sh/mira-ci-v5-72b63ad014f94c75b13e85a69fd2470c >/dev/null || true
