name: Apply Grill-Me Hardening

on:
  push:
    branches:
      - feature/grill-me-q61-q82
    paths:
      - scripts/grill_me_hardening.py
      - Mira/**
      - README.md
      - docs/**
      - .github/workflows/grill-me-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grill-me-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grill-me-q61-q82
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply hardening
        run: python scripts/grill_me_hardening.py

      - name: Commit hardening
        run: |
          if git diff --quiet; then
            echo "No hardening changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mira README.md docs scripts
          git commit -m "chore: harden Grill-Me integration [hardened]"
          git push origin HEAD:feature/grill-me-q61-q82
